[project]
name = "notification-service"
version = "1.0.0"
description = "Notification & Audit Microservice"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "asyncpg>=0.29.0",
    "aio-pika>=9.4.0",
    "pyjwt>=2.9.0",
    "cryptography>=43.0.0",
    "greenlet>=3.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
